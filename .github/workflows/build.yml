# McBar — Creado por Andrés Londero
# Al subir mc.zip a la rama main: lo descomprime, sube los archivos al repo, borra mc.zip,
# corre las pruebas y compila McBar.exe (un solo archivo, no necesita instalar .NET).
# 1.9.2: además arma McBar-Store.msix (edición Microsoft Store) para subir al Partner Center.
name: Compilar McBar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir mc.zip (si se subió)
        shell: pwsh
        run: |
          if (Test-Path mc.zip) {
            Expand-Archive -Path mc.zip -DestinationPath . -Force
            Remove-Item mc.zip
            # El propio workflow no se puede actualizar desde acá (GitHub no lo permite con este token):
            # si cambia, hay que subirlo a mano. Se deja el que ya estaba en el repo.
            git checkout HEAD -- .github/workflows 2>$null
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "Actualizar código desde mc.zip"
              git push
              if ($LASTEXITCODE -ne 0) { Write-Error "No se pudo subir el código"; exit 1 }
            }
          } else {
            Write-Host "No hay mc.zip: se compila el código del repo."
          }
          exit 0

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pruebas
        run: dotnet test tests/McBar.Tests/McBar.Tests.csproj -c Release --nologo

      - name: Compilar McBar.exe
        run: >
          dotnet publish src/McBar/McBar.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true -o publish --nologo

      - name: Guardar McBar.exe
        uses: actions/upload-artifact@v4
        with:
          name: McBar-win-x64
          path: publish/McBar.exe

      # ---------- 1.9.2: edición Microsoft Store (MSIX) ----------
      - name: Compilar la edición Store
        run: >
          dotnet publish src/McBar/McBar.csproj -c Release -r win-x64 --self-contained true
          -p:McBarStore=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true -o store-pkg --nologo

      - name: Armar McBar-Store.msix
        shell: pwsh
        run: |
          # versión del .csproj (1.9.2 → 1.9.2.0: la Store pide el último número en 0)
          [xml]$proj = Get-Content src/McBar/McBar.csproj
          $ver = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $ver = "$ver.0"
          Copy-Item packaging/store/Assets store-pkg/Assets -Recurse -Force
          (Get-Content packaging/store/AppxManifest.xml -Raw).Replace('__VERSION__', $ver) | Set-Content store-pkg/AppxManifest.xml -Encoding utf8
          Remove-Item store-pkg/*.pdb -ErrorAction SilentlyContinue
          $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $kit) { Write-Error "No se encontró makeappx.exe"; exit 1 }
          $bin = Split-Path $kit.FullName
          # índice de recursos (para los íconos en distintos tamaños)
          & "$bin\makepri.exe" createconfig /cf priconfig.xml /dq es-ES /o
          & "$bin\makepri.exe" new /pr store-pkg /cf priconfig.xml /of store-pkg\resources.pri /o
          if ($LASTEXITCODE -ne 0) { Write-Host "makepri falló: se arma el paquete sin índice de recursos"; Remove-Item store-pkg\resources.pri -ErrorAction SilentlyContinue }
          & $kit.FullName pack /d store-pkg /p McBar-Store.msix /o
          if ($LASTEXITCODE -ne 0) { Write-Error "makeappx falló"; exit 1 }
          Write-Host "Listo: McBar-Store.msix versión $ver"

      - name: Guardar McBar-Store.msix
        uses: actions/upload-artifact@v4
        with:
          name: McBar-Store-msix
          path: McBar-Store.msix

      # ---------- 1.9.55: publicar la versión (para que McBar avise cuando hay una nueva) ----------
      # Si algo falla acá, la compilación igual queda como buena (continue-on-error).
      - name: Publicar la versión (Release)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$proj = Get-Content src/McBar/McBar.csproj
          $ver = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $tag = "v$ver"
          # notas: la primera sección del CHANGELOG
          $notes = ""
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md -Encoding utf8
            $start = ($lines | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            $next = ($lines | Select-String -Pattern '^## ' | Select-Object -Skip 1 -First 1).LineNumber
            if ($start) { $end = if ($next) { $next - 2 } else { $lines.Count - 1 }; $notes = ($lines[($start - 1)..$end] -join "`n") }
          }
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag publish/McBar.exe McBar-Store.msix --clobber
          } else {
            gh release create $tag publish/McBar.exe McBar-Store.msix --title "McBar $ver" --notes-file notes.md
          }
          exit 0
